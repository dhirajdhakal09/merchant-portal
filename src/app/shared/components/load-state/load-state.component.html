@switch (state()) {
  @case ('loading') {
    <div class="d-flex justify-content-center py-5">
      <div class="spinner-border text-primary">
        <span class="visually-hidden">{{ message() }}</span>
      </div>
    </div>
  }
  @case ('error') {
    <div
      class="alert alert-danger d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2"
    >
      <span>{{ message() }}</span>
      <button type="button" class="btn btn-outline-danger btn-sm" (click)="retry.emit()">
        Retry
      </button>
    </div>
  }
  @case ('empty') {
    <p class="text-center text-body-secondary py-5 mb-0">{{ message() }}</p>
  }
}
